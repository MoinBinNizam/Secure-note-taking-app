<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#ffb695",
                    "background": "#fcf8ff",
                    "secondary-fixed-dim": "#4edea3",
                    "primary-container": "#4f46e5",
                    "secondary-fixed": "#6ffbbe",
                    "error": "#ba1a1a",
                    "on-secondary-container": "#00714d",
                    "on-primary": "#ffffff",
                    "inverse-surface": "#302f39",
                    "on-surface-variant": "#464555",
                    "surface": "#fcf8ff",
                    "primary-fixed": "#e2dfff",
                    "on-secondary-fixed-variant": "#005236",
                    "on-primary-fixed": "#0f0069",
                    "on-surface": "#1b1b24",
                    "tertiary-container": "#a44100",
                    "inverse-on-surface": "#f3effc",
                    "on-tertiary-fixed": "#351000",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-high": "#eae6f4",
                    "error-container": "#ffdad6",
                    "surface-bright": "#fcf8ff",
                    "on-primary-fixed-variant": "#3323cc",
                    "secondary-container": "#6cf8bb",
                    "surface-tint": "#4d44e3",
                    "inverse-primary": "#c3c0ff",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "primary-fixed-dim": "#c3c0ff",
                    "surface-variant": "#e4e1ee",
                    "on-primary-container": "#dad7ff",
                    "primary": "#3525cd",
                    "outline": "#777587",
                    "tertiary": "#7e3000",
                    "on-tertiary-container": "#ffd2be",
                    "surface-container-low": "#f5f2ff",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed": "#002113",
                    "on-error": "#ffffff",
                    "tertiary-fixed": "#ffdbcc",
                    "on-background": "#1b1b24",
                    "on-tertiary-fixed-variant": "#7b2f00",
                    "secondary": "#006c49",
                    "outline-variant": "#c7c4d8",
                    "surface-container": "#f0ecf9",
                    "surface-container-highest": "#e4e1ee",
                    "surface-dim": "#dcd8e5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "4px",
                    "xs": "4px",
                    "max-width-content": "1200px",
                    "margin-mobile": "16px",
                    "lg": "24px",
                    "gutter": "24px",
                    "md": "16px",
                    "xl": "40px",
                    "sm": "8px",
                    "margin-desktop": "48px"
            },
            "fontFamily": {
                    "h2": ["Inter"],
                    "body-lg": ["Inter"],
                    "h3": ["Inter"],
                    "body-md": ["Inter"],
                    "h1-mobile": ["Inter"],
                    "h1": ["Inter"],
                    "label-md": ["Inter"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "h2": ["30px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "h1-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "600"}],
                    "h1": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "label-sm": ["12px", {"lineHeight": "1.2", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #fcf8ff;
            color: #1b1b24;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-background {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.05) 0%, rgba(252, 248, 255, 0.1) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile glass-background">
<!-- Signup Container -->
<main class="w-full max-w-[440px] flex flex-col gap-lg animate-in fade-in duration-700">
<!-- Header Section -->
<header class="flex flex-col items-center text-center gap-sm">
<div class="w-14 h-14 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 mb-md">
<span class="material-symbols-outlined text-on-primary text-[32px]" data-icon="shield" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
<h1 class="font-h1-mobile text-h1-mobile text-on-surface tracking-tight">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Secure your thoughts with end-to-end encryption.</p>
</header>
<!-- Main Auth Card -->
<div class="bg-surface-container-lowest rounded-[32px] p-lg shadow-[0px_10px_40px_rgba(0,0,0,0.04)] border border-outline-variant/30">
<form class="flex flex-col gap-md">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-primary ml-1" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border border-outline-variant rounded-xl font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-outline/60" id="email" placeholder="alex@securenotes.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-primary ml-1" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-surface-container-low border border-outline-variant rounded-xl font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-outline/60" id="password" placeholder="••••••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Interests Tag Cloud Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-primary">Interests</label>
<span class="font-label-sm text-label-sm text-outline">Press Enter to add</span>
</div>
<div class="w-full p-3 bg-surface-container-low border border-outline-variant rounded-xl min-h-[120px] flex flex-wrap gap-2 items-start focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary transition-all">
<!-- Accumulated Tags -->
<div class="inline-flex items-center gap-1.5 bg-primary text-on-primary px-3 py-1.5 rounded-full font-label-sm text-label-sm shadow-sm transition-all hover:scale-105 active:scale-95">
                            Productivity
                            <span class="material-symbols-outlined text-[14px] cursor-pointer" data-icon="close">close</span>
</div>
<div class="inline-flex items-center gap-1.5 bg-primary text-on-primary px-3 py-1.5 rounded-full font-label-sm text-label-sm shadow-sm transition-all hover:scale-105 active:scale-95">
                            Journaling
                            <span class="material-symbols-outlined text-[14px] cursor-pointer" data-icon="close">close</span>
</div>
<div class="inline-flex items-center gap-1.5 bg-primary text-on-primary px-3 py-1.5 rounded-full font-label-sm text-label-sm shadow-sm transition-all hover:scale-105 active:scale-95">
                            Security
                            <span class="material-symbols-outlined text-[14px] cursor-pointer" data-icon="close">close</span>
</div>
<div class="inline-flex items-center gap-1.5 bg-primary text-on-primary px-3 py-1.5 rounded-full font-label-sm text-label-sm shadow-sm transition-all hover:scale-105 active:scale-95">
                            SaaS
                            <span class="material-symbols-outlined text-[14px] cursor-pointer" data-icon="close">close</span>
</div>
<!-- Dynamic Input Area -->
<input class="flex-1 bg-transparent border-none focus:ring-0 p-1 font-body-md text-body-md min-w-[80px]" placeholder="Add more..." type="text"/>
</div>
</div>
<!-- Terms & Conditions -->
<div class="flex items-start gap-3 px-1 mt-2">
<input class="mt-1 w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/30" id="terms" type="checkbox"/>
<label class="font-label-md text-on-surface-variant leading-relaxed" for="terms">
                        I agree to the <a class="text-primary font-bold hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-bold hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full bg-primary text-on-primary py-4 rounded-2xl font-h3 text-h3 shadow-lg shadow-primary/25 hover:bg-primary-container hover:-translate-y-0.5 active:scale-95 transition-all duration-200" type="submit">
                    Get Started
                </button>
</form>
<div class="mt-lg pt-lg border-t border-outline-variant/30 flex flex-col items-center gap-md">
<p class="font-label-md text-on-surface-variant">Already have an account? <a class="text-primary font-bold hover:underline" href="#">Log In</a></p>
<div class="w-full flex items-center gap-4">
<div class="h-[1px] flex-1 bg-outline-variant/50"></div>
<span class="font-label-sm text-outline">OR SIGN UP WITH</span>
<div class="h-[1px] flex-1 bg-outline-variant/50"></div>
</div>
<div class="flex w-full gap-md">
<button class="flex-1 flex items-center justify-center gap-2 py-3 border border-outline-variant rounded-xl hover:bg-surface-container-high transition-colors">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA_e-5HWo9Hw8Zdpb-5-0FiOgg08YmxsDxDk1ipDy6ob8CMATJqL8h9qsq_gfY6_7SUr9B1BXOcOFYUZRuh5BjGi24pDnYMbWsal5VCrB-ngwhAG4XhyyM8uGGHL9hig4YGoMoV5hULUFJW34JtQCpHFvN8tJmWnpXje0iUEF7jxGxJo2ETM8yQY_vpZMCaVYpptjLA9r56ms-AmMNjXNOkPniL3Og11uylFUx6tEjwLmxGsekxtCdLfH7mq-tpa_VNdkPOUOXyB28"/>
<span class="font-label-md">Google</span>
</button>
<button class="flex-1 flex items-center justify-center gap-2 py-3 border border-outline-variant rounded-xl hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="font-label-md">Apple</span>
</button>
</div>
</div>
</div>
<!-- Security Footer -->
<footer class="flex items-center justify-center gap-md py-4">
<div class="flex items-center gap-2 px-3 py-1 bg-secondary/10 text-secondary rounded-full">
<span class="material-symbols-outlined text-[16px]" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm uppercase tracking-wider">AES-256 Encrypted</span>
</div>
</footer>
</main>
<!-- Background Decorative Element (Soft SaaS Aesthetic) -->
<div class="fixed top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px] -z-10"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[50%] h-[50%] bg-secondary/5 rounded-full blur-[120px] -z-10"></div>
</body></html>
